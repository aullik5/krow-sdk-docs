[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "krow-cookbook-literature-reviewer"
version = "0.1.0"
description = "Krow SDK Cookbook v3 · 学术文献综述 demo（多 PDF 抽取 + 主题聚类 + 章节生成 + 引用守门）"
authors = [{ name = "Krow team", email = "sdk@krow.cn" }]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "krow-agent-sdk>=0.8.12.5",
    # PDF 抽取 —— 与 financial-analyst 一致
    "pdfplumber>=0.10",
]

[project.optional-dependencies]
# 注：综述 docx / pdf 输出**复用** Krow 内置 word_smart_export 工具（SSOT），
# 不需要在本 cookbook 加 python-docx / fpdf2 / reportlab 等依赖。
# scikit-learn 仅用于增强主题聚类（可选 fallback：纯 Python TF-IDF）
ml = [
    "scikit-learn>=1.3",
    "numpy>=1.24",
]
test = [
    "pytest>=8.0",
    "pytest-timeout>=2.2",
    # 2026-05-26 hf33: journey_e2e expected_card 读取需要 PyYAML
    # (_journey_e2e_helpers.py:load_expected_card).
    "PyYAML>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
include = [
    "literature_reviewer_plugin.py",
    "main.py",
    "act_assets/**",
    "sample_data/**",
    "README.md",
]

[tool.hatch.build.targets.sdist]
include = [
    "literature_reviewer_plugin.py",
    "main.py",
    "act_assets/**",
    "sample_data/**",
    "README.md",
    "tests/**",
    "pyproject.toml",
    ".gitignore",
]
