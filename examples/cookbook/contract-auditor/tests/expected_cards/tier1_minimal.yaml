# contract-auditor Tier 1 最小跑（合成商业合同 PDF, 强阻断 Gate 启用）
#
# 跑法：python main.py <contract.pdf> --quiet
#
# 用户价值优先（W5 重写 · 2026-05-19）
# ════════════════════════════════════════
#
# 合同审阅对用户（法务 / 业务 PM）的核心价值：
#   1. 风险报告必须**指出具体风险条款**（合同金额 / 违约金率 / 不平衡条款）→ keywords + grounding
#   2. 风险报告必须**给出风险等级评定**（高 / 中 / 低）→ ``must_address``
#   3. 风险报告必须**结构化**（风险点清单 + 修订建议）→ ``markdown_structure``
#   4. 风险报告必须**识别 'unbalanced liability' 风险**（合成合同含此条款）→ keywords
#   5. 风险报告**不能鬼打墙** → ``max_repeated_paragraphs``
#
# 输入数据（来自 test_contract_auditor_journey_e2e.py）
# ═══════════════════════════════════════════════════
#   title              = "软件开发服务合同"
#   parties            = ("北京某某科技有限公司", "上海某某软件开发有限公司")
#   contract_value_cny = 1_500_000
#   include_unbalanced_liability = True  # 含"甲方免责"条款
#   合同细节：违约金日 0.5%，累计 30 日，30% 违约金
#
# W5 实测调整（2026-05-19）：
#   - LLM 偶尔不显式列合同金额 → main.py prompt 已加"合同基本信息"必含段
#   - numeric_grounding 只对稳定数据设硬约束（30 / 0.5），合同金额走 keywords OR

exit_code: 0
# Walltime SSOT (P2-A · 2026-05-25 · lessons 2026-05-25 §教训5)
max_walltime_s_serial: 800
max_walltime_s_parallel: 1200

required_artifacts:
  - risk_report.md

min_artifact_bytes:
  risk_report.md: 800

# ──────────────────────────────────────────────────
# 维度 1（功能可用性）：必含合同审阅核心法律词
# ──────────────────────────────────────────────────
required_keywords_in:
  risk_report.md:
    - ["违约", "Breach", "违约责任"]
    - ["责任", "Liability", "责任分配"]
    - ["风险", "Risk", "风险点"]
    - ["条款", "Clause", "Article", "条文"]
    # 必须识别"甲方免责" / "不平衡" / "倾斜" 风险（合成合同核心问题）
    - ["甲方免责", "不平衡", "不对等", "倾斜", "unfair", "imbalance",
       "失衡", "中风险", "高风险", "免责"]

# ──────────────────────────────────────────────────
# 维度 2（数据 grounding · W5 新增）：风险报告必须引用合同核心数据
# 仅对 LLM 实测稳定输出的数字设硬约束.
# 合同金额（1,500,000）漂移面广（写 "150 万" / "1.5 百万" / 略），
# 改用 keywords OR（见维度 1.1）.
# ──────────────────────────────────────────────────
numeric_grounding:
  risk_report.md:
    # 违约金率 0.5% 或 30 日 — 任一即可（任一在合同审阅中都是关键数字）
    - value: 0.5
      tolerance: 0.05
      format_alts: ["0.5%", "0.50%", "千分之五", "0.5 %", "0.5"]
    - value: 30
      tolerance: 0.001
      format_alts: ["30 日", "30 天", "三十日", "三十天", "30%", "30日", "30天", "30 %"]

# ──────────────────────────────────────────────────
# 维度 3（markdown 结构 · W5 新增）
# ──────────────────────────────────────────────────
markdown_structure:
  risk_report.md:
    # 至少 2 段（实测 LLM 输出 7 段：执行摘要/必备条款/高风险/中风险/语义风险/建议/附录）
    min_h2_sections: 2
    no_duplicate_h2: true
    # 至少 3 条修订建议 / 风险点 bullet
    min_bullet_items: 3

# ──────────────────────────────────────────────────
# 维度 4（用户决策问题 · W5 新增）：必须给风险等级评定
# ──────────────────────────────────────────────────
must_address:
  risk_report.md:
    - question: "总体风险等级评定"
      any_keywords:
        - "高风险"
        - "中等风险"
        - "中风险"
        - "低风险"
        - "高风险等级"
        - "中风险等级"
        - "低风险等级"
        - "重大风险"
        - "重要风险"
        - "整体风险"
        - "风险等级"
    - question: "修订建议或行动项"
      any_keywords:
        - "建议"
        - "推荐"
        - "应当"
        - "需要修订"
        - "需要修改"
        - "请修改"
        - "调整"
        - "改进"
        - "修订"

# ──────────────────────────────────────────────────
# 维度 5（重复段落检测 · W5 新增）
# ──────────────────────────────────────────────────
max_repeated_paragraphs:
  risk_report.md: 0
