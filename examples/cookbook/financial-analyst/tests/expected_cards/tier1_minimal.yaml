# financial-analyst Tier 1 最小跑（合成单 PDF, 关闭估值锚）
#
# 跑法：python main.py <synth.pdf> --no-valuation --quiet
#
# 用户价值优先（W5 重写 · 2026-05-19）
# ════════════════════════════════════════
#
# v0.8.12.10 W5：从"功能可用性验证"升级到"用户价值导向"。
# 投资简报对用户的核心价值是：
#   1. 报告里的 KPI 数字必须**来自原始年报**（不能编造）→ ``numeric_grounding``
#   2. 报告必须**结构化**（5 段标准披露）+ 不重复输出 → ``markdown_structure``
#   3. 报告必须**给出明确投资动作**（买入/卖出/持有/观望）→ ``must_address``
#   4. 报告**不能鬼打墙**（重复段落让用户体验灾难）→ ``max_repeated_paragraphs``
#
# 与主仓 ``tests/e2e_real/_journey_runner.py`` 同样哲学：System 1 严守，
# **不发明 LLM-as-judge** 二级判官（DRY · 主仓 _journey_runner.py:1089）.
#
# 输入数据（来自 test_financial_analyst_journey_e2e.py）
# ════════════════════════════════════════════════════
#   company        = "Skyline Tech Corp"
#   revenue_yi     = 128.6
#   net_profit_yi  = 15.3
#   gross_margin   = 42.5%
#   roe            = 18.1%
#   debt_to_equity = 0.32

exit_code: 0
max_walltime_s: 700

required_artifacts:
  - investment_memo.md

# ──────────────────────────────────────────────────
# 维度 1（功能可用性）：基础字节量 + 关键词
# ──────────────────────────────────────────────────
min_artifact_bytes:
  investment_memo.md: 800

required_keywords_in:
  investment_memo.md:
    - ["营业收入", "Revenue", "营收"]
    - ["净利润", "Net Profit", "Net Income"]
    - ["毛利", "Gross Margin"]
    - ["ROE", "净资产收益率"]
    - ["风险", "Risk"]

# 合规红线（InsiderInfoGate 守门）
forbidden_keywords_in:
  investment_memo.md:
    - "内幕"
    - "未公开"
    - "MNPI"
    - "尚未披露"

# ──────────────────────────────────────────────────
# 维度 2（数据 grounding · W5 新增）：报告里的 KPI 必须来自原年报
# 防 LLM 编造数字 / 错误抽取（如把营收当净利润）
# ──────────────────────────────────────────────────
numeric_grounding:
  investment_memo.md:
    # 营业收入 128.6 亿元（绝对硬约束 — LLM 应抽取此数字）
    - {value: 128.6, tolerance: 0.05}
    # 净利润 15.3 亿元（W5 实测发现 LLM 偶尔编造为 11.9 — 必须 grounding）
    - {value: 15.3, tolerance: 0.05}
    # 毛利率 42.5%
    - {value: 42.5, tolerance: 0.02}
    # ROE 18.1%
    - {value: 18.1, tolerance: 0.02}

# ──────────────────────────────────────────────────
# 维度 3（markdown 结构 · W5 新增）：防重复 H2 bug + 强制结构化
# ──────────────────────────────────────────────────
markdown_structure:
  investment_memo.md:
    # 5 段标准披露 → 至少 5 个 H2（DisclosureCompletenessGate 约束）
    min_h2_sections: 5
    # 防 LLM 重复输出"投资建议（结论）"段（W5 实测 bug · 2026-05-19）
    no_duplicate_h2: true
    # 注：``min_bullet_items`` 不强制 — LLM 风格漂移，有时全散文，
    # 行动建议清单要求由 ``must_address`` 维度覆盖.

# ──────────────────────────────────────────────────
# 维度 4（用户决策问题 · W5 新增）：报告必须给明确投资动作
# ──────────────────────────────────────────────────
must_address:
  investment_memo.md:
    # 投资建议 — 必须含明确动作（任一即可；含"暂缓/谨慎"等数据不足时合理动作）
    - question: "投资建议（明确动作 / 谨慎措辞）"
      any_keywords:
        - "买入"
        - "卖出"
        - "持有"
        - "观望"
        - "观察"
        - "回避"
        - "增持"
        - "减持"
        - "暂缓"
        - "谨慎"
        - "审慎"
        - "中性"
        - "待评估"
        - "暂不评级"
        - "不予评级"
        - "不建议"
        - "避免"
    # 风险评估 — 必须含风险等级评定 / 风险维度（数据不全时也可写"置信度受限"）
    - question: "风险等级评定 / 数据置信度 / 风险论述"
      any_keywords:
        - "高风险"
        - "中等风险"
        - "中风险"
        - "低风险"
        - "风险有限"
        - "重大风险"
        - "重要风险"
        - "核心风险"
        - "主要风险"
        - "整体风险"
        - "财务风险"
        - "投资风险"
        - "置信度受限"
        - "置信度低"
        - "置信度显著下降"
        - "数据缺失风险"
        - "数据风险"
        - "数据完整性不足"
        - "数据完整性严重不足"
        - "完整性不足"
        - "信息不完整"
        - "不完整"
        - "重大不确定"
        - "不确定性"
        - "局限性"
        - "存在显著局限性"

# ──────────────────────────────────────────────────
# 维度 5（重复段落检测 · W5 新增）：严格禁止 LLM 重复输出
# ──────────────────────────────────────────────────
max_repeated_paragraphs:
  investment_memo.md: 0
