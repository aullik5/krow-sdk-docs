# reasoning-analyst Tier 3 预期结果卡（whodunit 真凶推理 · PR-B）
#
# 2026-07-06 三议题辩论 议题 3：真实世界 journey——X/Z 悲剧推理真凶（hypothesis_test /
# 竞争假设排除 ACH）。whodunit_x 与 whodunit_z 共用本卡（同策略、同结果结构）。
# 「等价桌面」验收 = 桌面 hypothesis_test journey 卡的结果导向子集（去 UI 断言）。
#
# 数据分层：smoke（合成密室短篇，CI）用宽松阈值；真数据（KROW_JOURNEY_TRAGEDY_X/Z）
# 本地 real-LLM 跑，同一张卡。真凶身份由 LLM 自由发挥，故只断言产物 + 结构化字段。

exit_code: 0

# hypothesis_test 竞争假设排除多轮递归；给足余量（lessons "并行 walltime 硬阈"）。
max_walltime_s_serial: 1800
max_walltime_s_parallel: 2400

required_artifacts:
  - reasoning_hypothesis_test.md
  - reasoning_hypothesis_test.json
  - summary.json

min_artifact_bytes:
  reasoning_hypothesis_test.md: 200
  reasoning_hypothesis_test.json: 200
  summary.json: 80

required_keywords_in:
  reasoning_hypothesis_test.json:
    - reasoning_completed
    - final_output
    - strategy
  summary.json:
    - n_completed
    - reasoning_completed
