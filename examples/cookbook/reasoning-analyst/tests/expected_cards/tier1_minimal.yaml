# reasoning-analyst Tier 1 预期结果卡（evidence_chain 链式证据 journey）
#
# 多维断言（System 1 · 零 LLM 二级判官）；详 _journey_e2e_helpers.assert_journey。
# 设计取舍：reasoning 结论文本结构由 LLM 自由发挥（非固定 markdown 模板），故只断言
# 产物存在 + 结构化 json 含关键字段 + 最小字节，内容级硬下界由测试自定义断言负责。

exit_code: 0

# walltime（serial 单跑 / parallel 同进程多 journey）
# 2026-07-12 重标定：evidence_chain 推理深度随 #1226(G1-G5 接地/建链) + #1228
# 增强后显著提升（真机 tool_counts：evidence≈14 / link≈12 / summarize≈6），叠加
# real-LLM 空 action_input 二次恢复 + plan length cap 重规划等常态变异，两次真机
# 单跑分别 1260s / 1537s（内容断言全过，仅 walltime 硬阈假阳）。900s 已不匹配现
# 实推理规模。按 AGENTS.md "并行 walltime 硬阈" 反模式（速度是第 3 优先级，不该
# System 1 硬闸假阳）对齐 whodunit tier 的 1800/2400，给足 real-LLM 长尾余量。
max_walltime_s_serial: 1800
max_walltime_s_parallel: 2400

required_artifacts:
  - reasoning_evidence_chain.md
  - reasoning_evidence_chain.json
  - summary.json

min_artifact_bytes:
  reasoning_evidence_chain.md: 200
  reasoning_evidence_chain.json: 200
  summary.json: 80

# 结构化结论 json 必含的判定字段（证明 cookbook 的 outcome schema 落盘正确）
required_keywords_in:
  reasoning_evidence_chain.json:
    - reasoning_completed
    - final_output
    - strategy
  summary.json:
    - n_completed
    - reasoning_completed
