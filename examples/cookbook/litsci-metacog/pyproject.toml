[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "krow-cookbook-litsci-metacog"
version = "0.1.0"
description = "Krow SDK Cookbook · 配置决策脑三注册表 demo（把'文献检索下载完整度'信号接进 GWT 决策脑：观测层 contributor + 唤醒层 wake trigger + '注册≠激活'单测闭环）"
authors = [{ name = "Krow team", email = "sdk@krow.cn" }]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "krow-agent-sdk>=0.9.0.59",
    # 纯 stdlib —— cookbook 保持最小依赖面
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-timeout>=2.2",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
include = [
    "litsci_metacog_demo.py",
    "main.py",
    "README.md",
]

[tool.hatch.build.targets.sdist]
include = [
    "litsci_metacog_demo.py",
    "main.py",
    "README.md",
    "tests/**",
    "pyproject.toml",
    ".gitignore",
]
