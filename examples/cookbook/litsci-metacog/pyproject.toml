[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "krow-cookbook-litsci-metacog"
version = "0.1.0"
description = "Krow SDK Cookbook · 配置决策脑三注册表 demo（把'文献检索下载完整度'信号接进 GWT 决策脑：观测层 contributor + 唤醒层 wake trigger + '注册≠激活'单测闭环）"
authors = [{ name = "Krow team", email = "sdk@krow.cn" }]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "krow-agent-sdk>=0.9.0.59",
    # 纯 stdlib —— cookbook 保持最小依赖面
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-timeout>=2.2",
]

# 自动发现（0.9.0.60+）：装上即被总线看见，不需要任何一方 import 本模块。
# `register_*` 那条路仍然有效，但它有个容易漏的前提——得有人 import 你的模块；
# 包装上了不等于被导入了，靠导入顺序碰运气会时灵时不灵，且失败时静默。
[project.entry-points."krow.metacog.contributors"]
litsci_download = "litsci_metacog_demo:DownloadCompletenessContributor"

[project.entry-points."krow.metacog.wake_triggers"]
litsci_zero_download = "litsci_metacog_demo:wake_zero_download_with_hits"

[tool.hatch.build.targets.wheel]
packages = ["."]
include = [
    "litsci_metacog_demo.py",
    "main.py",
    "README.md",
]

[tool.hatch.build.targets.sdist]
include = [
    "litsci_metacog_demo.py",
    "main.py",
    "README.md",
    "tests/**",
    "pyproject.toml",
    ".gitignore",
]
