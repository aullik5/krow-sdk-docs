[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "krow-cookbook-target-nominator"
version = "0.1.0"
description = "Krow SDK Cookbook · AI 靶点提名 demo（HPA/Open Targets 取数 + 多维加权打分 + 反幻觉 gate，借鉴 Cell GPNMB CAR-T）"
authors = [{ name = "Krow team", email = "sdk@krow.cn" }]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "krow-agent-sdk>=0.9.0.48",
    # 取数走 stdlib urllib —— 无额外 HTTP 依赖（cookbook 保持最小依赖面）
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-timeout>=2.2",
    # journey_e2e expected_card 读取需要 PyYAML（_journey_e2e_helpers.load_expected_card）
    "PyYAML>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
include = [
    "target_nominator_plugin.py",
    "main.py",
    "act_assets/**",
    "sample_data/**",
    "README.md",
]

[tool.hatch.build.targets.sdist]
include = [
    "target_nominator_plugin.py",
    "main.py",
    "act_assets/**",
    "sample_data/**",
    "README.md",
    "tests/**",
    "pyproject.toml",
    ".gitignore",
]
