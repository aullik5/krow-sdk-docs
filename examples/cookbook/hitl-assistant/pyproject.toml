[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "krow-cookbook-hitl-assistant"
version = "0.1.0"
description = "Krow SDK cookbook · HITL CAD 参数变更助手（挂起/续跑/多模态/强制确认门 demo）"
authors = [{ name = "Krow team", email = "sdk@krow.cn" }]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    # HITL API（with_hitl / Agent.resume / checkpoint 管理）自 0.9.0.5 起提供
    "krow-agent-sdk>=0.9.0.5",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-timeout>=2.2",
    "PyYAML>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
include = [
    "hitl_assistant_plugin.py",
    "main.py",
    "act_assets/**",
    "sample_data/**",
    "README.md",
]

[tool.hatch.build.targets.sdist]
include = [
    "hitl_assistant_plugin.py",
    "main.py",
    "act_assets/**",
    "sample_data/**",
    "README.md",
    "tests/**",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-v", "--tb=short"]
